<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>CIS-DF Flashcards | สอบให้ผ่าน!</title>
<style>
/* ============ RESET ============ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0f0f1a;
  --bg2: #1a1a2e;
  --bg3: #252540;
  --bg4: #2d2d4a;
  --text: #e8e8f0;
  --text2: #b0b0c8;
  --text3: #7878a0;
  --purple: #a855f7;
  --purple2: #7c3aed;
  --purple3: #6d28d9;
  --green: #22c55e;
  --green2: #16a34a;
  --red: #ef4444;
  --orange: #f59e0b;
  --blue: #3b82f6;
  --cyan: #06b6d4;
  --radius: 16px;
  --radius-sm: 12px;
  --shadow: 0 8px 32px rgba(0,0,0,0.3);
}

html[data-theme="light"] {
  --bg: #f0f0f5;
  --bg2: #ffffff;
  --bg3: #e8e8f0;
  --bg4: #d8d8e8;
  --text: #1a1a2e;
  --text2: #4a4a6a;
  --text3: #8888a8;
  --shadow: 0 8px 32px rgba(0,0,0,0.08);
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", "Sarabun", Helvetica, Arial, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

/* ============ LAYOUT ============ */
.app {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 12px;
  padding-bottom: 40px;
}

/* ============ HEADER ============ */
.header {
  text-align: center;
  padding: 28px 20px 24px;
  background: linear-gradient(135deg, var(--purple3), var(--purple));
  border-radius: var(--radius);
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}

.header::before {
  content: "";
  position: absolute;
  top: -50%;
  right: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 60%);
  pointer-events: none;
}

.header h1 {
  font-size: 1.6rem;
  font-weight: 800;
  color: #fff;
  position: relative;
  z-index: 1;
}

.header p {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.8);
  margin-top: 4px;
  position: relative;
  z-index: 1;
}

/* ============ THEME TOGGLE ============ */
.theme-btn {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 999;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background-color: var(--bg2);
  border: 2px solid var(--bg4);
  font-size: 1.2rem;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.2s;
  box-shadow: var(--shadow);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none;
  appearance: none;
}

.theme-btn:hover,
.theme-btn:focus {
  border-color: var(--purple);
  outline: none;
}

/* ============ CONTROLS ============ */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
}

.ctrl-btn {
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--bg4);
  background-color: var(--bg2);
  color: var(--text2);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none;
  appearance: none;
  font-family: inherit;
}

.ctrl-btn:hover,
.ctrl-btn:focus {
  border-color: var(--purple);
  color: var(--purple);
  outline: none;
}

.ctrl-btn.active {
  border-color: var(--purple);
  color: #fff;
  background-color: var(--purple);
}

/* ============ STATS BAR ============ */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

.stat-item {
  background-color: var(--bg2);
  border-radius: var(--radius-sm);
  padding: 12px 6px;
  text-align: center;
  border: 1px solid var(--bg3);
}

.stat-num {
  font-size: 1.4rem;
  font-weight: 800;
  display: block;
  line-height: 1.2;
}

.stat-num.c-total { color: var(--purple); }
.stat-num.c-known { color: var(--green); }
.stat-num.c-learning { color: var(--orange); }
.stat-num.c-unseen { color: var(--text3); }

.stat-lbl {
  font-size: 0.65rem;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 2px;
  display: block;
}

/* ============ PROGRESS ============ */
.progress-wrap {
  margin-bottom: 16px;
  padding: 0 4px;
}

.progress-track {
  height: 8px;
  background-color: var(--bg3);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--green), var(--cyan));
  transition: width 0.5s ease;
  width: 0%;
}

.progress-text {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  font-size: 0.75rem;
  color: var(--text3);
}

/* ============ SECTION FILTER ============ */
.section-filter {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  overflow-x: auto;
  padding: 4px 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.section-filter::-webkit-scrollbar { display: none; }

.section-chip {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.78rem;
  white-space: nowrap;
  cursor: pointer;
  font-weight: 600;
  border: 2px solid var(--bg4);
  background-color: var(--bg2);
  color: var(--text3);
  transition: all 0.2s ease;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none;
  appearance: none;
  font-family: inherit;
}

.section-chip:hover { border-color: var(--purple); }
.section-chip.active {
  background-color: var(--purple);
  color: #fff;
  border-color: var(--purple);
}

/* ============ FLASHCARD ============ */
.card-container {
  margin-bottom: 16px;
  min-height: 300px;
  -webkit-perspective: 1200px;
  perspective: 1200px;
}

.flashcard {
  position: relative;
  width: 100%;
  min-height: 300px;
  cursor: pointer;
  -webkit-transform-style: preserve-3d;
  transform-style: preserve-3d;
  -webkit-transition: transform 0.6s cubic-bezier(0.4,0.2,0.2,1);
  transition: transform 0.6s cubic-bezier(0.4,0.2,0.2,1);
  -webkit-tap-highlight-color: transparent;
}

.flashcard.flipped {
  -webkit-transform: rotateY(180deg);
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  min-height: 300px;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  border-radius: var(--radius);
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  overflow-y: auto;
  max-height: 65vh;
}

.card-front {
  background: linear-gradient(145deg, var(--bg2), var(--bg3));
  border: 2px solid var(--bg4);
}

.card-back {
  background: linear-gradient(145deg, #0d2818, #1a3a28);
  border: 2px solid var(--green2);
  -webkit-transform: rotateY(180deg);
  transform: rotateY(180deg);
}

html[data-theme="light"] .card-back {
  background: linear-gradient(145deg, #f0fdf4, #dcfce7);
  border-color: var(--green2);
}

/* Card sub-elements */
.card-section-tag {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 8px;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 12px;
  width: -webkit-fit-content;
  width: fit-content;
}

.tag-csdm { background: rgba(168,85,247,0.15); color: var(--purple); }
.tag-config { background: rgba(59,130,246,0.12); color: var(--blue); }
.tag-govern { background: rgba(239,68,68,0.12); color: var(--red); }
.tag-ingest { background: rgba(245,158,11,0.12); color: var(--orange); }
.tag-insight { background: rgba(6,182,212,0.12); color: var(--cyan); }

.card-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.card-badge .num {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text3);
}

.card-freq {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 0.65rem;
  font-weight: 700;
}

.freq-hot { background: rgba(239,68,68,0.15); color: var(--red); }
.freq-warm { background: rgba(245,158,11,0.12); color: var(--orange); }
.freq-normal { background: rgba(100,100,140,0.12); color: var(--text3); }

.card-question {
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.6;
  flex: 1;
  color: var(--text);
}

.card-hint {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  background: rgba(168,85,247,0.08);
  border-left: 4px solid var(--purple);
  font-size: 0.82rem;
  color: var(--text2);
}

.card-tap {
  text-align: center;
  margin-top: 14px;
  font-size: 0.75rem;
  color: var(--text3);
  opacity: 0.7;
}

/* Back side */
.answer-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--green);
  margin-bottom: 8px;
}

.card-answer {
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.6;
  margin-bottom: 14px;
}

html[data-theme="light"] .card-answer { color: #166534; }

.card-answer div { margin-bottom: 4px; }

.card-explain {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.75);
  line-height: 1.7;
  padding: 14px 16px;
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius-sm);
}

html[data-theme="light"] .card-explain {
  color: #1a3a28;
  background: rgba(0,0,0,0.04);
}

.card-explain .th-note {
  display: block;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.1);
  font-weight: 600;
  color: var(--green);
}

html[data-theme="light"] .card-explain .th-note {
  border-top-color: rgba(0,0,0,0.1);
  color: var(--green2);
}

/* ============ RATING BUTTONS ============ */
.rating-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.rate-btn {
  padding: 14px 8px;
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  border-width: 2px;
  border-style: solid;
  transition: all 0.2s ease;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none;
  appearance: none;
  font-family: inherit;
  line-height: 1.3;
}

.rate-btn:active {
  -webkit-transform: scale(0.95);
  transform: scale(0.95);
}

.rate-know {
  border-color: var(--green2);
  background: rgba(34,197,94,0.12);
  color: var(--green);
}
.rate-know:hover { background-color: var(--green); color: #fff; }

.rate-learn {
  border-color: var(--orange);
  background: rgba(245,158,11,0.12);
  color: var(--orange);
}
.rate-learn:hover { background-color: var(--orange); color: #fff; }

.rate-skip {
  border-color: var(--bg4);
  background-color: var(--bg2);
  color: var(--text3);
}
.rate-skip:hover { background-color: var(--bg4); color: var(--text); }

/* ============ NAVIGATION ============ */
.nav-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.nav-btn {
  flex: 1;
  padding: 14px 8px;
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  border: 2px solid var(--bg4);
  background-color: var(--bg2);
  color: var(--text);
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none;
  appearance: none;
  font-family: inherit;
}

.nav-btn:hover,
.nav-btn:focus {
  border-color: var(--purple);
  background-color: var(--bg3);
  outline: none;
}

.nav-btn:active {
  -webkit-transform: scale(0.97);
  transform: scale(0.97);
}

/* ============ CHEAT SHEET ============ */
.cheat-section { margin-top: 24px; }

.cheat-toggle {
  width: 100%;
  padding: 16px 20px;
  border-radius: var(--radius);
  background-color: var(--bg2);
  border: 2px solid var(--bg4);
  color: var(--text);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: border-color 0.2s ease;
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none;
  appearance: none;
  font-family: inherit;
  text-align: left;
}

.cheat-toggle:hover { border-color: var(--purple); }

.cheat-toggle .arrow {
  margin-left: auto;
  transition: transform 0.3s ease;
  font-size: 1.1em;
}

.cheat-toggle.open .arrow {
  -webkit-transform: rotate(180deg);
  transform: rotate(180deg);
}

.cheat-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease;
}

.cheat-content.open { max-height: 8000px; }

.cheat-box {
  margin-top: 12px;
  padding: 20px;
  border-radius: var(--radius);
  background-color: var(--bg2);
  border: 1px solid var(--bg3);
}

.cheat-title {
  font-size: 1rem;
  font-weight: 800;
  margin-bottom: 14px;
}

.cheat-grid {
  display: grid;
  gap: 6px;
}

.cheat-item {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 10px;
  background-color: var(--bg3);
  font-size: 0.8rem;
  align-items: center;
}

.cheat-item .key {
  color: var(--orange);
  font-weight: 700;
  word-break: break-word;
}

.cheat-item .val {
  color: var(--green);
  font-weight: 600;
  word-break: break-word;
}

/* ============ SHORTCUTS INFO ============ */
.shortcuts {
  margin-top: 16px;
  padding: 14px;
  border-radius: var(--radius-sm);
  background-color: var(--bg2);
  border: 1px solid var(--bg3);
  font-size: 0.78rem;
  color: var(--text3);
  text-align: center;
  line-height: 2;
}

.shortcuts kbd {
  padding: 2px 7px;
  border-radius: 5px;
  background-color: var(--bg4);
  font-family: inherit;
  font-weight: 700;
  color: var(--text2);
  border: 1px solid var(--text3);
  font-size: 0.75rem;
}

/* ============ ANIMATION ============ */
@-webkit-keyframes slideIn {
  from { opacity: 0; -webkit-transform: translateY(16px); transform: translateY(16px); }
  to { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-animate {
  -webkit-animation: slideIn 0.35s ease;
  animation: slideIn 0.35s ease;
}

/* ============ RESPONSIVE ============ */
@media screen and (max-width: 400px) {
  .app { padding: 8px; }
  .card-face { padding: 18px 14px; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .controls { gap: 6px; }
  .ctrl-btn { padding: 7px 10px; font-size: 0.76rem; }
  .header h1 { font-size: 1.3rem; }
  .header p { font-size: 0.8rem; }
  .card-question { font-size: 0.95rem; }
  .card-answer { font-size: 0.95rem; }
}

@media screen and (min-width: 768px) {
  .card-face { min-height: 340px; }
  .card-container { min-height: 340px; }
  .flashcard { min-height: 340px; }
}

/* ============ PRINT ============ */
@media print {
  body { background: #fff; color: #000; }
  .controls, .nav-row, .rating-row, .theme-btn, .shortcuts, .card-tap { display: none !important; }
  .flashcard { transform: none !important; -webkit-transform: none !important; }
  .card-face { position: relative !important; box-shadow: none !important; border: 1px solid #ccc !important; }
  .card-back { transform: none !important; -webkit-transform: none !important; display: block !important; margin-top: 16px; }
}
</style>
</head>
<body>

<button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme" aria-label="Toggle Theme">🌙</button>

<div class="app" id="app">

  <!-- HEADER -->
  <div class="header">
    <h1>🎯 CIS-DF Flashcards</h1>
    <p>Data Foundations — จำไว สอบผ่าน!</p>
  </div>

  <!-- CONTROLS -->
  <div class="controls" id="controls">
    <button class="ctrl-btn active" onclick="setMode('all')" id="mode-all">📚 ทั้งหมด</button>
    <button class="ctrl-btn" onclick="setMode('unseen')" id="mode-unseen">🆕 ยังไม่ดู</button>
    <button class="ctrl-btn" onclick="setMode('learning')" id="mode-learning">🔄 ไม่แม่น</button>
    <button class="ctrl-btn" onclick="setMode('known')" id="mode-known">✅ จำได้</button>
    <button class="ctrl-btn" onclick="shuffleDeck()">🔀 สุ่ม</button>
    <button class="ctrl-btn" onclick="resetAll()">🗑️ รีเซ็ต</button>
  </div>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-item"><span class="stat-num c-total" id="s-total">0</span><span class="stat-lbl">ทั้งหมด</span></div>
    <div class="stat-item"><span class="stat-num c-known" id="s-known">0</span><span class="stat-lbl">จำได้</span></div>
    <div class="stat-item"><span class="stat-num c-learning" id="s-learning">0</span><span class="stat-lbl">ไม่แม่น</span></div>
    <div class="stat-item"><span class="stat-num c-unseen" id="s-unseen">0</span><span class="stat-lbl">ยังไม่ดู</span></div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-text"><span id="prog-label">0 / 0</span><span id="prog-pct">0%</span></div>
  </div>

  <!-- SECTION FILTER -->
  <div class="section-filter" id="section-filter"></div>

  <!-- FLASHCARD -->
  <div class="card-container" id="card-container">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="card-face card-front" id="card-front"></div>
      <div class="card-face card-back" id="card-back"></div>
    </div>
  </div>

  <!-- RATING -->
  <div class="rating-row">
    <button class="rate-btn rate-know" onclick="rateCard('known')">✅ จำได้!</button>
    <button class="rate-btn rate-learn" onclick="rateCard('learning')">🔄 ยังไม่แม่น</button>
    <button class="rate-btn rate-skip" onclick="rateCard('unseen')">⏭ ข้าม</button>
  </div>

  <!-- NAV -->
  <div class="nav-row">
    <button class="nav-btn" onclick="prevCard()">⬅ ก่อนหน้า</button>
    <button class="nav-btn" onclick="flipCard()">🔄 พลิก</button>
    <button class="nav-btn" onclick="nextCard()">ถัดไป ➡</button>
  </div>

  <!-- CHEAT SHEET -->
  <div class="cheat-section">
    <button class="cheat-toggle" onclick="toggleCheat()" id="cheat-toggle">
      📋 สูตรลัด "เห็นคำนี้ → ตอบอันนี้"
      <span class="arrow">▼</span>
    </button>
    <div class="cheat-content" id="cheat-content">
      <div class="cheat-box">
        <div class="cheat-title">🎯 Quick Match — เห็นปุ๊บ ตอบปั๊บ!</div>
        <div class="cheat-grid" id="cheat-grid"></div>
      </div>
    </div>
  </div>

// =====================================================
// STATE
// =====================================================
var currentIdx=0, isFlipped=false, mode="all", secFilter="all", cardStates={}, filtered=[];

function load(){try{var s=localStorage.getItem("cisdf2_st");if(s)cardStates=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem("cisdf2_st",JSON.stringify(cardStates))}catch(e){}}
function getState(id){return cardStates[id]||"unseen"}

function applyFilters(){
  filtered=CARDS.filter(function(c){
    if(secFilter!=="all"&&c.section!==secFilter)return false;
    if(mode!=="all"&&getState(c.id)!==mode)return false;
    return true;
  });
  if(currentIdx>=filtered.length)currentIdx=Math.max(0,filtered.length-1);
}

function tagClass(s){
  var m={"CSDM":"tag-csdm","Configuration":"tag-config","Govern":"tag-govern","Ingest":"tag-ingest","Insight":"tag-insight"};
  return m[s]||"tag-csdm";
}
function freqLabel(f){
  var m={hot:"\uD83D\uDD25 ออกบ่อยมาก",warm:"⚡ ออกบ่อย",normal:"\uD83D\uDCCC ปกติ"};
  return m[f]||"";
}
function freqClass(f){return "freq-"+(f||"normal")}
function stars(n){var s="";for(var i=0;i<n;i++)s+="⭐";return s}

function renderCard(){
  var fc=document.getElementById("flashcard");
  var front=document.getElementById("card-front");
  var back=document.getElementById("card-back");
  var container=document.getElementById("card-container");

  isFlipped=false;
  fc.classList.remove("flipped");

  if(!filtered.length){
    front.innerHTML='<div style="text-align:center;padding:40px 0"><div style="font-size:3rem;margin-bottom:16px">\uD83C\uDF89</div><div style="font-size:1.1rem;font-weight:700;margin-bottom:8px">ไม่มีการ์ดในหมวดนี้</div><div style="color:var(--text3);font-size:.9rem">ลองเปลี่ยน filter หรือ mode ดูครับ</div></div>';
    back.innerHTML="";
    return;
  }

  var c=filtered[currentIdx];

  front.innerHTML=
    '<span class="card-section-tag '+tagClass(c.section)+'">'+c.section+'</span>'+
    '<div class="card-badge"><span class="num">#'+c.id+' · '+(currentIdx+1)+'/'+filtered.length+'</span>'+
    '<span class="card-freq '+freqClass(c.freq)+'">'+stars(c.stars)+' '+freqLabel(c.freq)+'</span></div>'+
    '<div class="card-question">❓ '+c.q.replace(/\n/g,"<br>")+'</div>'+
    (c.hint?'<div class="card-hint">\uD83D\uDCA1 '+c.hint+'</div>':'')+
    '<div class="card-tap">\uD83D\uDC46 แตะ/คลิกเพื่อดูคำตอบ</div>';

  var ansLines=c.a.split("\n").map(function(l){return "<div>"+l+"</div>"}).join("");
  back.innerHTML=
    '<span class="card-section-tag '+tagClass(c.section)+'">'+c.section+'</span>'+
    '<div class="answer-label">✅ คำตอบ</div>'+
    '<div class="card-answer">'+ansLines+'</div>'+
    '<div class="card-explain">'+c.explain+
    (c.th?'<span class="th-note">\uD83C\uDDF9\uD83C\uDDED '+c.th+'</span>':'')+
    '</div>';

  container.classList.remove("card-animate");
  void container.offsetWidth;
  container.classList.add("card-animate");
}

function renderStats(){
  var base=secFilter==="all"?CARDS:CARDS.filter(function(c){return c.section===secFilter});
  var t=0,k=0,l=0,u=0;
  base.forEach(function(c){
    t++;var s=getState(c.id);
    if(s==="known")k++;else if(s==="learning")l++;else u++;
  });
  document.getElementById("s-total").textContent=t;
  document.getElementById("s-known").textContent=k;
  document.getElementById("s-learning").textContent=l;
  document.getElementById("s-unseen").textContent=u;
  var pct=t?Math.round(k/t*100):0;
  document.getElementById("progress-fill").style.width=pct+"%";
  document.getElementById("prog-label").textContent=k+" / "+t+" จำได้";
  document.getElementById("prog-pct").textContent=pct+"%";
}

function renderSections(){
  var secs=["all"];
  CARDS.forEach(function(c){if(secs.indexOf(c.section)<0)secs.push(c.section)});
  var labels={all:"\uD83D\uDCDA ทั้งหมด",CSDM:"\uD83C\uDFD7️ CSDM",Configuration:"⚙️ Config",Govern:"\uD83D\uDEE1️ Govern",Ingest:"\uD83D\uDCE5 Ingest",Insight:"\uD83D\uDD0D Insight"};
  var html="";
  secs.forEach(function(s){
    html+='<button class="section-chip'+(s===secFilter?" active":"")+'" onclick="setSectionFilter(\''+s+'\')">'+
    (labels[s]||s)+'</button>';
  });
  document.getElementById("section-filter").innerHTML=html;
}

function renderCheat(){
  var html="";
  CHEAT.forEach(function(pair){
    html+='<div class="cheat-item"><span class="key">'+pair[0]+'</span><span class="val">→ '+pair[1]+'</span></div>';
  });
  document.getElementById("cheat-grid").innerHTML=html;
}

function renderAll(){applyFilters();renderCard();renderStats();renderSections()}

// =====================================================
// ACTIONS
// =====================================================
function flipCard(){
  if(!filtered.length)return;
  isFlipped=!isFlipped;
  document.getElementById("flashcard").classList.toggle("flipped",isFlipped);
}

function nextCard(){
  if(!filtered.length)return;
  currentIdx=(currentIdx+1)%filtered.length;
  renderCard();
}

function prevCard(){
  if(!filtered.length)return;
  currentIdx=(currentIdx-1+filtered.length)%filtered.length;
  renderCard();
}

function rateCard(r){
  if(!filtered.length)return;
  cardStates[filtered[currentIdx].id]=r;
  save();nextCard();renderStats();
}

function setMode(m){
  mode=m;currentIdx=0;
  var btns=document.querySelectorAll(".controls .ctrl-btn");
  for(var i=0;i<btns.length;i++)btns[i].classList.remove("active");
  var el=document.getElementById("mode-"+m);
  if(el)el.classList.add("active");
  renderAll();
}

function setSectionFilter(s){secFilter=s;currentIdx=0;renderAll()}

function shuffleDeck(){
  for(var i=filtered.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=filtered[i];filtered[i]=filtered[j];filtered[j]=tmp;
  }
  currentIdx=0;renderCard();
}

function resetAll(){
  if(confirm("รีเซ็ตความก้าวหน้าทั้งหมด?")){
    cardStates={};save();renderAll();
  }
}

function toggleCheat(){
  document.getElementById("cheat-toggle").classList.toggle("open");
  document.getElementById("cheat-content").classList.toggle("open");
}

function toggleTheme(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next=cur==="light"?"dark":"light";
  document.documentElement.setAttribute("data-theme",next);
  document.querySelector(".theme-btn").textContent=next==="light"?"☀️":"\uD83C\uDF19";
  try{localStorage.setItem("cisdf2_theme",next)}catch(e){}
}

// KEYBOARD
document.addEventListener("keydown",function(e){
  switch(e.key){
    case " ":case "Enter":e.preventDefault();flipCard();break;
    case "ArrowRight":nextCard();break;
    case "ArrowLeft":prevCard();break;
    case "1":rateCard("known");break;
    case "2":rateCard("learning");break;
    case "3":rateCard("unseen");break;
  }
});

// SWIPE
var sx=0,sy=0;
var cc=document.getElementById("card-container");
cc.addEventListener("touchstart",function(e){sx=e.changedTouches[0].screenX;sy=e.changedTouches[0].screenY},{passive:true});
cc.addEventListener("touchend",function(e){
  var dx=e.changedTouches[0].screenX-sx;
  var dy=e.changedTouches[0].screenY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){
    if(dx>0)prevCard();else nextCard();
  }
},{passive:true});

// INIT
(function(){
  try{
    var t=localStorage.getItem("cisdf2_theme");
    if(t){document.documentElement.setAttribute("data-theme",t);
    document.querySelector(".theme-btn").textContent=t==="light"?"☀️":"\uD83C\uDF19";}
  }catch(e){}
  load();renderCheat();renderAll();
})();
</script>
